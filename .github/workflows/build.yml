name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer and dependencies
        run: yes |
          sudo apt-get update
          sudo apt-get install -y build-essential libltdl-dev libffi-dev libssl-dev python3-dev zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake
          pip install --upgrade buildozer Cython==0.29.33 virtualenv

      - name: Build with Buildozer
        # وضعنا yes | لكي يوافق السيرفر تلقائياً على شروط أندرويد ولا يتوقف
        run: yes | buildozer android debug

      - name: Upload APK artifact
        # هنا تم التحديث إلى v4 وهو سبب المشكلة الأساسي
        uses: actions/upload-artifact@v4
        with:
          name: B-Ultra-APK
          path: bin/*.apk
